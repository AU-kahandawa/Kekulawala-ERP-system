    <!-- ─── Inline Critical CSS for instant background ──── -->
    <style>
      html, body, #root { margin: 0; padding: 0; background: #060d1f; }
      body { overflow: hidden; }
      /* Prevent FOUC */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #060d1f;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ─── Service Worker Registration ─────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[PWA] Service Worker registered. Scope:', reg.scope);

              // Check for updates
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version available. Refresh to update.');
                    // Optionally show update toast here
                  }
                });
              });
            })
            .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }

      // Prevent double-tap zoom on iOS (ERP UX improvement)
      document.addEventListener('touchend', function(event) {
        var now = (new Date()).getTime();
        if (now - this.lastTouch <= 300) { event.preventDefault(); }
        this.lastTouch = now;
      }, { passive: false });
    </script>
  </body>
